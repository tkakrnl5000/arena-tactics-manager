<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d13" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Arena Tactics Manager — 3D 아레나 매니저</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app-shell">
      <!-- 상단 미니멀 글로벌 내비게이션 바 -->
      <header id="global-top-bar">
        <div class="top-left">
          <button id="btn-go-home" class="top-nav-pill hidden" type="button" title="홈(로비)으로 이동">🏠 홈</button>
          <span class="brand-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
              <polygon points="12,2 21,7 21,17 12,22 3,17 3,7" stroke="currentColor" stroke-width="2" />
              <circle cx="12" cy="12" r="3" fill="currentColor" />
            </svg>
          </span>
          <span id="top-week-badge" class="pill pill-accent">HOME</span>
          <button id="top-room-badge" class="pill pill-room" type="button" title="구단 좌석/난입 현황">#----</button>
          <button id="btn-copy-room" class="icon-pill icon-xs" type="button" title="방 코드 복사" aria-label="방 코드 복사">📋</button>
        </div>
        <div class="top-right">
          <button id="btn-sfx-toggle" class="icon-pill is-on" type="button" title="효과음 켜기/끄기">🔊</button>
          <span id="top-net-badge" class="pill pill-local">● LOCAL</span>
          <button id="btn-go-hub" class="icon-pill hidden" type="button">허브</button>
        </div>
      </header>

      <main id="screen-viewport">
        <!-- 1. 로비 (LOBBY) -->
        <section id="screen-lobby" class="screen active" data-screen="LOBBY">
          <div class="lobby-hero">
            <div class="lobby-hero-top">
              <span class="eyebrow">3D ARENA TACTICS · PRO LEAGUE</span>
              <span id="top-patch-badge" class="pill pill-muted">PATCH 1.0</span>
            </div>
            <h1 class="hero-title">아레나 택틱스 매니저</h1>
            <p class="hero-sub">배틀라이트급 3D 3v3 투기장 · 10구단 프로 리그 · 감독&선수 전술 시뮬레이션</p>
          </div>

          <div id="lobby-resume-card" class="resume-banner hidden"></div>

          <div class="card card-elevated">
            <div class="card-header-row">
              <h2 class="card-title">새 시즌 / 매치 시작</h2>
              <span class="muted-text">16 챔피언 · 12 감독</span>
            </div>
            <div class="mode-cards-grid">
              <button id="btn-create-room" class="mode-card is-league" type="button">
                <div class="mode-card-head">
                  <span class="mode-icon">🏆</span>
                  <span class="mode-badge">RECOMMENDED</span>
                </div>
                <div class="mode-card-title">10구단 프로 리그 (구단주 모드)</div>
                <div class="mode-card-desc">10팀 9라운드 정규리그 + Top4 플레이오프. 감독 선임·오더 노트로 구단을 지휘하세요.</div>
              </button>
              <button id="btn-create-arcade-room" class="mode-card is-arcade" type="button">
                <div class="mode-card-head">
                  <span class="mode-icon">⚔️</span>
                  <span class="mode-badge arcade">LIVE 2P</span>
                </div>
                <div class="mode-card-title">2인 아케이드 라이브 (즉시 Bo3)</div>
                <div class="mode-card-desc">실시간 직접 스네이크 밴픽 · 증강 선택 · 진영 교대 재대결</div>
              </button>
            </div>
            <button id="btn-quick-exhibition" class="btn btn-secondary btn-block" type="button" style="margin-top:8px;">
              ⚡ 3D 아레나 즉시 관전 (3v3 빠른 대결)
            </button>

            <div class="lobby-section-divider"></div>
            <div class="card-header-row" style="margin-bottom:6px;">
              <h3 class="card-title-sm">리그 진행 일정</h3>
              <span class="muted-text small">로비/허브 변경 가능</span>
            </div>
            <div id="lobby-schedule-mode" class="sched-mode-grid"></div>
            <div class="lobby-section-divider"></div>
            <div class="card-header-row" style="margin-bottom:6px;">
              <h3 class="card-title-sm">전장 아레나 선택</h3>
              <span class="muted-text small">3D 투기장 4종</span>
            </div>
            <div id="lobby-map-selector" class="map-selector-grid"></div>
          </div>

          <div class="card">
            <div class="card-header-row">
              <h2 class="card-title">방 코드 입장 & 서버 설정</h2>
              <span id="lobby-room-status" class="muted-text">대기 중</span>
            </div>
            <div class="join-row">
              <input id="input-room-code" class="input-field num" type="text" inputmode="numeric" maxlength="4" placeholder="방 코드 4자리" />
              <input id="input-coach-name" class="input-field" type="text" maxlength="16" placeholder="구단주 닉네임" value="Owner Lee" />
              <button id="btn-join-room" class="btn btn-primary" type="button">입장</button>
            </div>
            <button id="btn-open-neon-modal" class="btn btn-ghost btn-block" type="button" style="margin-top:8px;">
              ☁️ 온라인 DB (Neon) 연결 설정
            </button>
            <div id="lobby-seats-list" class="seats-list" style="margin-top:8px;"></div>
          </div>
        </section>

        <!-- 1-B. 2인 아케이드 대기실 (ARCADE_LOBBY) -->
        <section id="screen-arcade-lobby" class="screen" data-screen="ARCADE_LOBBY">
          <div id="arcade-lobby-header" class="card"></div>
          <div id="arcade-versus-board" class="arcade-versus-grid"></div>
          <div class="arcade-actions-panel card">
            <div class="btn-row">
              <button id="btn-arcade-reroll" class="btn btn-secondary" type="button">🎲 로스터 리롤</button>
              <button id="btn-arcade-vs-ai" class="btn btn-secondary" type="button">🤖 AI 라이벌 대결</button>
            </div>
            <button id="btn-arcade-ready" class="btn btn-primary btn-block" type="button" style="margin-top:8px;">⚔️ 전투 준비 완료</button>
            <button id="btn-arcade-exit-lobby" class="btn btn-ghost btn-block" type="button" style="margin-top:6px;">🏠 홈으로 나가기</button>
          </div>
        </section>

        <!-- 2. 주간 리그 허브 (WEEKLY_HUB) -->
        <section id="screen-weekly-hub" class="screen" data-screen="WEEKLY_HUB">
          <div id="hub-club-banner" class="hub-club-banner"></div>
          <div id="hub-schedule-bar" class="hub-schedule-bar"></div>
          <nav id="hub-tabs" class="segmented-tabs" aria-label="허브 메뉴">
            <button class="seg-btn active" data-hub-tab="STANDINGS" type="button">순위·일정</button>
            <button class="seg-btn" data-hub-tab="ROSTER" type="button">선수·루틴</button>
            <button class="seg-btn" data-hub-tab="COACH" type="button">감독 오더</button>
            <button class="seg-btn" data-hub-tab="FACILITY" type="button">시설·재정</button>
          </nav>
          <div id="hub-tab-content" class="hub-tab-content"></div>
          <div class="hub-footer-actions">
            <button id="btn-start-round-match" class="btn btn-primary btn-block" type="button">경기 관람 · 개시</button>
            <div class="btn-row-4">
              <button id="btn-open-news" class="btn btn-ghost" type="button">📰 뉴스</button>
              <button id="btn-open-coach-market" class="btn btn-ghost" type="button">📋 감독</button>
              <button id="btn-quick-sim-week" class="btn btn-ghost" type="button">⏩ 스킵</button>
              <button id="btn-open-seats-modal" class="btn btn-ghost" type="button">👥 구단</button>
            </div>
          </div>
        </section>

        <!-- 3. 스네이크 밴픽 (DRAFT) -->
        <section id="screen-draft" class="screen" data-screen="DRAFT">
          <div class="draft-header">
            <div id="draft-series-title" class="draft-series-title">WEEK 1 · Bo3</div>
            <div id="draft-phase-banner" class="draft-phase-banner">BAN BLUE</div>
          </div>
          <div id="draft-map-banner" class="draft-map-banner"></div>
          <div id="draft-coach-bar" class="draft-coach-bar"></div>
          <div class="draft-slots-row">
            <div id="draft-blue-slots" class="draft-team-col blue"></div>
            <div id="draft-red-slots" class="draft-team-col red"></div>
          </div>
          <div id="draft-assign-panel" class="draft-assign-panel hidden"></div>
          <div id="draft-champ-grid" class="draft-champ-grid"></div>
          <div id="draft-hint-bar" class="draft-hint-bar">감독이 구단주 노트에 맞춰 밴픽을 진행합니다</div>
        </section>

        <!-- 4. 실시간 3D 아레나 전투 (COMBAT) -->
        <section id="screen-combat" class="screen" data-screen="COMBAT">
          <div class="combat-top-hud">
            <div id="combat-scoreboard" class="combat-scoreboard"></div>
            <div class="combat-sub-row">
              <div id="combat-rites-strip" class="combat-rites-strip">증강 없음</div>
              <div class="combat-speed-controls">
                <button id="btn-live-override" class="mini-btn" type="button">감독위임</button>
                <button id="btn-speed-toggle" class="mini-btn num" type="button">1x</button>
                <button id="btn-pause-combat" class="mini-btn" type="button">정지</button>
              </div>
            </div>
          </div>

          <div id="vod-timeline-bar" class="vod-timeline-bar hidden"></div>

          <div class="arena-wrapper">
            <canvas id="arena-canvas"></canvas>
            <canvas id="arena-hud-canvas" class="arena-hud-overlay"></canvas>
            <div id="call-banner" class="call-banner hidden"></div>
            <div id="round-end-overlay" class="round-end-overlay hidden"></div>
          </div>

          <div class="combat-roster-strip">
            <div id="blue-team-bars" class="team-bars"></div>
            <div id="red-team-bars" class="team-bars"></div>
          </div>

          <div id="combat-ticker" class="combat-ticker">
            <div id="ticker-list" class="ticker-list"></div>
          </div>

          <!-- 구단주 관전 브로드캐스트 바 + 2P/직접개입 전술 바 -->
          <div id="bottom-tactical-bar" class="bottom-tactical-bar">
            <div id="owner-broadcast-bar" class="owner-broadcast-bar hidden"></div>
            <div id="tactical-calls-wrap" class="tactical-calls-wrap">
              <button class="coach-call-btn" data-call="EX_RUSH" type="button">
                <span class="call-title">🎯 딜러 점사</span>
                <span class="call-sub" id="sub-EX_RUSH">후열 집중 포커싱</span>
                <span class="call-meta num" id="meta-EX_RUSH">준비</span>
                <span class="cd-mask" id="cd-EX_RUSH"></span>
              </button>
              <button class="coach-call-btn" data-call="COUNTER_STANCE" type="button">
                <span class="call-title">🛡️ 호위·카이팅</span>
                <span class="call-sub" id="sub-COUNTER_STANCE">진형 유지 · 방어</span>
                <span class="call-meta num" id="meta-COUNTER_STANCE">준비</span>
                <span class="cd-mask" id="cd-COUNTER_STANCE"></span>
              </button>
              <button class="coach-call-btn" data-call="ORB_FOCUS" type="button">
                <span class="call-title">💠 오브 장악</span>
                <span class="call-sub" id="sub-ORB_FOCUS">중앙 오브 · 성소 선점</span>
                <span class="call-meta num" id="meta-ORB_FOCUS">준비</span>
                <span class="cd-mask" id="cd-ORB_FOCUS"></span>
              </button>
            </div>
          </div>
        </section>

        <!-- 5. 세트 간 Rite 증강 카드 선택 (RITE_DRAFT) -->
        <section id="screen-rite-draft" class="screen" data-screen="RITE_DRAFT">
          <div class="card">
            <div class="card-header-row">
              <h2 class="card-title">RITE 증강 선택</h2>
              <span class="muted-text">다음 세트 적용</span>
            </div>
            <div id="rite-series-header" class="rite-series-header"></div>
          </div>
          <div id="rite-coach-actions" class="rite-coach-actions"></div>
          <div id="rite-cards-list" class="rite-cards-list"></div>
          <div id="rite-equipped-summary" class="rite-equipped-summary"></div>
        </section>

        <!-- 6. Top-4 Bo5 플레이오프 브래킷 (PLAYOFF_BRACKET) -->
        <section id="screen-playoff-bracket" class="screen" data-screen="PLAYOFF_BRACKET">
          <div id="playoff-header" class="card"></div>
          <div id="playoff-tree-container" class="playoff-tree-container"></div>
          <div class="playoff-actions">
            <button id="btn-playoff-next-match" class="btn btn-primary btn-block" type="button">다음 플레이오프 경기 진행</button>
            <button id="btn-playoff-quick-sim" class="btn btn-secondary btn-block" type="button">⏩ 플레이오프 경기 스킵</button>
            <button id="btn-new-season" class="btn btn-ghost btn-block hidden" type="button">새 시즌 시작</button>
          </div>
        </section>

        <!-- 7. 시즌 종료 스토브리그 & 명예의 전당 (STOVE_LEAGUE) -->
        <section id="screen-stove-league" class="screen" data-screen="STOVE_LEAGUE">
          <div id="stove-header" class="card"></div>
          <div id="stove-content" class="stack-7"></div>
          <div class="playoff-actions">
            <button id="btn-start-next-season" class="btn btn-primary btn-block" type="button">🚀 다음 시즌 (Season N+1) 개막</button>
            <button id="btn-open-stove-news" class="btn btn-secondary btn-block" type="button">📰 시즌 결산 뉴스 보기</button>
          </div>
        </section>
      </main>

      <!-- 공용 바텀시트 / 모달 -->
      <div id="app-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
          <div class="modal-header">
            <h3 id="modal-title" class="modal-title">알림</h3>
            <button id="modal-close-btn" class="modal-close" type="button">✕</button>
          </div>
          <div id="modal-body" class="modal-body"></div>
        </div>
      </div>

      <div id="hud-toast" class="hud-toast" aria-live="polite"></div>
    </div>

    <script type="module" src="./js/controller.js"></script>
  </body>
</html>
